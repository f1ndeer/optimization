[package]
name = "win_optimizer_pro"
version = "2.0.0"
edition = "2021"
authors = ["WinOptimizer Team"]
description = "Advanced Windows 10/11 & Game Optimizer Pro (Rust Native Edition)"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"
chrono = "0.4"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
